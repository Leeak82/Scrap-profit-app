<!DOCTYPE html>
<html>
<head><link rel="manifest" href="manifest.json">>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Profit Assistant V6</title>

<style>
body{margin:0;font-family:Arial;background:#071018;color:#edf6ff}
header{padding:20px;background:linear-gradient(135deg,#0e2a3a,#143b28)}
.wrap{padding:16px;max-width:900px;margin:auto}
.card{background:#101b26;border:1px solid #26394b;border-radius:16px;padding:16px;margin:14px 0}
button,input,select{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #344a60;background:#0a121b;color:#fff}
button{background:#22c55e;color:#06110a;font-weight:bold}
.secondary{background:#2563eb}
.big{font-size:34px;font-weight:bold;color:#38bdf8}
.good{background:#11331e;padding:10px;border-radius:12px;margin-top:10px}
.warn{background:#3a2410;padding:10px;border-radius:12px;margin-top:10px}
.item{background:#142333;padding:10px;border-radius:12px;margin:8px 0}
</style>
</head>

<body>

<header>
<h1>🧲 Scrap Profit Assistant V6</h1>
<div>Market-aware decisions. Real-world scrap strategy.</div>
</header>

<div class="wrap">

<div class="card">
<button class="secondary" onclick="window.open('https://lens.google.com/','_blank')">
📸 Open Google Lens
</button>

<label>Metal</label>
<select id="metal">
<option value="copper">Copper</option>
<option value="brass">Brass</option>
<option value="aluminum">Aluminum</option>
<option value="lead">Lead</option>
<option value="steel">Steel</option>
</select>

<label>Weight (lbs)</label>
<input id="weight" type="number" value="1">

<label>Condition</label>
<select id="condition">
<option value="1">Clean</option>
<option value="0.75">Dirty</option>
<option value="0.5">Mixed</option>
</select>

<label>Trip distance (miles)</label>
<input id="distance" type="number" value="5">

<label>City</label>
<input id="city" value="Tacoma">

<button onclick="calc()">💰 Analyze</button>
</div>

<div class="card" id="out"></div>

<div class="card">
<h3>Inventory</h3>
<div id="inv"></div>
<button onclick="save()">➕ Save Item</button>
<button onclick="clearInv()">🗑 Clear</button>
</div>

</div>

<script>

// MARKET PROXY PRICES (realistic ranges)
const market={
copper:3.6,
brass:2.1,
aluminum:0.65,
lead:0.55,
steel:0.09
};

// SMART DECISION ENGINE
function decision(metal,val,weight,distance){
if(val < 3) return "WAIT - build more weight";
if(metal==="steel" && weight < 60) return "NOT worth the trip";
if(distance > 15 && val < 25) return "Not worth fuel/time yet";
if(metal==="copper"||metal==="brass"){
if(val > 30) return "SELL NOW or check resale";
return "Compare eBay vs scrap";
}
if(val > 40) return "SELL TODAY";
return "Scrap if convenient";
}

// PROFIT SCORE
function score(val,metal){
let s=val*3;
if(metal==="copper") s+=20;
if(metal==="brass") s+=10;
return Math.min(100,Math.round(s));
}

let last=null;

function calc(){
let m=document.getElementById("metal").value;
let w=parseFloat(document.getElementById("weight").value);
let c=parseFloat(document.getElementById("condition").value);
let d=parseFloat(document.getElementById("distance").value);
let city=document.getElementById("city").value;

let price=market[m];
let total=w*price*c;

let s=score(total,m);
let dec=decision(m,total,w,d);

let maps=`https://www.google.com/maps/search/scrap+yard+near+${city}`;
let ebay=`https://www.ebay.com/sch/i.html?_nkw=${m}&LH_Sold=1`;

let tip="";
if(m==="copper") tip="Strip only if time > value gain";
if(m==="steel") tip="Only worth it in bulk";
if(m==="lead") tip="Wash hands, do not grind";

last={m,w,total,dec,s};

document.getElementById("out").innerHTML=`
<div class="big">$${total.toFixed(2)}</div>
<p>Estimated payout</p>

<p><b>Score:</b> ${s}/100</p>

<div class="good">${dec}</div>

<div class="warn">${tip}</div>

<br>
<a href="${maps}" target="_blank">📍 Find scrap yards</a><br>
<a href="${ebay}" target="_blank">🔎 Check resale value</a>
`;
}

function save(){
if(!last)return;
let items=JSON.parse(localStorage.getItem("inv")||"[]");
items.push(last);
localStorage.setItem("inv",JSON.stringify(items));
render();
}

function render(){
let items=JSON.parse(localStorage.getItem("inv")||"[]");
let total=0;
let html="";
items.forEach(x=>{
total+=x.total;
html+=`<div class="item">${x.m} - $${x.total.toFixed(2)}</div>`;
});
document.getElementById("inv").innerHTML=
`<div class="big">$${total.toFixed(2)}</div>`+html;
}

function clearInv(){
localStorage.removeItem("inv");
render();
}

render();
</script>

</body>
</html>
