<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Profit Assistant</title>

<style>
body{margin:0;font-family:system-ui;background:#071018;color:#fff}
header{padding:18px;font-size:22px;font-weight:bold}
.container{padding:14px;max-width:900px;margin:auto}
.card{background:#0f1f2b;border-radius:16px;padding:14px;margin-bottom:14px}
button,input,select{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:none}
button{background:#22c55e;color:#03120a;font-weight:bold}
.secondary{background:#2563eb;color:white}
.big{font-size:30px;color:#38bdf8}
.action{margin-top:10px;padding:10px;border-radius:10px;background:#16313f}
.item{background:#142333;padding:10px;border-radius:10px;margin-top:8px}
</style>
</head>

<body>

<header>🧲 Scrap Profit Assistant</header>

<div class="container">

<div class="card">

<button class="secondary" onclick="window.open('https://lens.google.com/')">
📸 Identify Item
</button>

<label>Metal</label>
<select id="metal">
<option value="copper">Copper</option>
<option value="brass">Brass</option>
<option value="aluminum">Aluminum</option>
<option value="lead">Lead</option>
<option value="steel">Steel</option>
</select>

<label>Weight (lbs)</label>
<input id="weight" type="number" value="1">

<label>Condition</label>
<select id="condition">
<option value="1">Clean</option>
<option value="0.75">Dirty</option>
<option value="0.5">Mixed</option>
</select>

<label>Distance (miles)</label>
<input id="distance" value="5">

<label>City</label>
<input id="city" value="Tacoma">

<button onclick="run()">Analyze</button>

</div>

<div class="card" id="out"></div>

<div class="card">
<h3>Inventory</h3>
<div id="inv"></div>
<button onclick="save()">Save</button>
<button onclick="clearInv()">Clear</button>
</div>

</div>

<script>

const ranges={
copper:[2.8,4.2],
brass:[1.5,2.5],
aluminum:[0.3,0.8],
lead:[0.3,0.7],
steel:[0.03,0.12]
};

let last=null;

function decision(avg,metal,weight,distance){
if(avg<3) return "Wait — not enough value yet";
if(metal==="steel"&&weight<60) return "Steel needs bulk — not worth trip";
if(distance>15 && avg<25) return "Fuel cost too high for payout";
if(metal==="copper"||metal==="brass") return "Check resale vs scrap";
if(avg>40) return "Sell immediately";
return "Scrap if you're already going";
}

function run(){
let m=document.getElementById("metal").value;
let w=parseFloat(document.getElementById("weight").value);
let c=parseFloat(document.getElementById("condition").value);
let d=parseFloat(document.getElementById("distance").value);
let city=document.getElementById("city").value;

let low=ranges[m][0]*w*c;
let high=ranges[m][1]*w*c;
let avg=(low+high)/2;

let dec=decision(avg,m,w,d);

let maps=`https://www.google.com/maps/search/scrap+yard+near+${city}`;
let ebay=`https://www.ebay.com/sch/i.html?_nkw=${m}&LH_Sold=1`;

last={m,avg};

document.getElementById("out").innerHTML=`
<div class="big">$${low.toFixed(2)} - $${high.toFixed(2)}</div>
<p>Average: $${avg.toFixed(2)}</p>

<div class="action">${dec}</div>

<div class="action">
<a href="${maps}" target="_blank">📍 Find Buyers</a>
</div>

<div class="action">
<a href="${ebay}" target="_blank">🔎 Check Resale</a>
</div>
`;
}

function save(){
if(!last)return;
let items=JSON.parse(localStorage.getItem("inv")||"[]");
items.push(last);
localStorage.setItem("inv",JSON.stringify(items));
render();
}

function render(){
let items=JSON.parse(localStorage.getItem("inv")||"[]");
let total=0,html="";
items.forEach(x=>{
total+=x.avg;
html+=`<div class="item">${x.m} - $${x.avg.toFixed(2)}</div>`;
});
document.getElementById("inv").innerHTML=
`<div class="big">$${total.toFixed(2)}</div>`+html;
}

function clearInv(){
localStorage.removeItem("inv");
render();
}

render();

</script>

</body>
</html>
