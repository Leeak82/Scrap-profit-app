<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrap Profit Assistant</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scrap App">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933245.png">

<style>
body{
margin:0;
font-family:system-ui;
background:linear-gradient(180deg,#071018,#0c1b26);
color:#fff
}

header{
padding:20px;
font-size:22px;
font-weight:bold
}

.container{
padding:15px;
max-width:900px;
margin:auto
}

.card{
background:#0f1f2b;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.4)
}

label{
display:block;
margin-top:10px;
font-size:14px;
color:#a9c3d8
}

input,select,button{
width:100%;
padding:12px;
margin-top:6px;
border-radius:12px;
border:none;
font-size:16px
}

input,select{
background:#08141d;
color:white
}

button{
background:#22c55e;
color:#03120a;
font-weight:bold
}

.secondary{
background:#2563eb;
color:white
}

.big{
font-size:32px;
font-weight:bold;
color:#38bdf8
}

.scorebar{
height:10px;
background:#1b2f3f;
border-radius:10px;
margin-top:8px;
overflow:hidden
}

.fill{
height:100%;
background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)
}

.action{
margin-top:10px;
padding:10px;
border-radius:10px;
background:#16313f
}

.item{
background:#142333;
padding:10px;
border-radius:10px;
margin-top:8px
}
</style>
</head>

<body>

<header>🧲 Scrap Profit Assistant</header>

<div class="container">

<div class="card">

<button class="secondary" onclick="window.open('https://lens.google.com/')">
📸 Identify with Google Lens
</button>

<label>Metal</label>
<select id="metal">
<option value="copper">Copper</option>
<option value="brass">Brass</option>
<option value="aluminum">Aluminum</option>
<option value="lead">Lead</option>
<option value="steel">Steel</option>
</select>

<label>Weight (lbs)</label>
<input id="weight" type="number" value="1">

<label>Condition</label>
<select id="condition">
<option value="1">Clean</option>
<option value="0.75">Dirty</option>
<option value="0.5">Mixed</option>
</select>

<label>Distance to yard (miles)</label>
<input id="distance" value="5">

<label>City</label>
<input id="city" value="Tacoma">

<button onclick="analyze()">Analyze</button>

</div>

<div class="card" id="result"></div>

<div class="card">
<h3>Inventory</h3>
<div id="inventory"></div>
<button onclick="save()">Save Item</button>
<button onclick="clearInv()">Clear</button>
</div>

</div>

<script>

const prices={
copper:3.6,
brass:2.1,
aluminum:0.65,
lead:0.55,
steel:0.09
};

let last=null;

function decision(val,metal,weight,distance){
if(val<3) return "Wait — build more weight";
if(metal==="steel"&&weight<60) return "Not worth trip";
if(distance>15 && val<25) return "Fuel cost too high";
if(metal==="copper"||metal==="brass") return "Check resale before scrap";
if(val>40) return "Sell now";
return "Sell if convenient";
}

function analyze(){
let m=document.getElementById("metal").value;
let w=parseFloat(document.getElementById("weight").value);
let c=parseFloat(document.getElementById("condition").value);
let d=parseFloat(document.getElementById("distance").value);
let city=document.getElementById("city").value;

let val=w*prices[m]*c;

let score=Math.min(100,Math.round(val*3 + (m==="copper"?20:0)));

let dec=decision(val,m,w,d);

let maps=`https://www.google.com/maps/search/scrap+yard+near+${city}`;
let ebay=`https://www.ebay.com/sch/i.html?_nkw=${m}&LH_Sold=1`;

last={m,val};

document.getElementById("result").innerHTML=`
<div class="big">$${val.toFixed(2)}</div>

<div>Profit Score: ${score}/100</div>

<div class="scorebar">
<div class="fill" style="width:${score}%"></div>
</div>

<div class="action">${dec}</div>

<div class="action">
<a href="${maps}" target="_blank">📍 Find Buyers</a>
</div>

<div class="action">
<a href="${ebay}" target="_blank">🔎 Check Resale</a>
</div>
`;
}

function save(){
if(!last)return;
let items=JSON.parse(localStorage.getItem("inv")||"[]");
items.push(last);
localStorage.setItem("inv",JSON.stringify(items));
render();
}

function render(){
let items=JSON.parse(localStorage.getItem("inv")||"[]");
let total=0;
let html="";
items.forEach(x=>{
total+=x.val;
html+=`<div class="item">${x.m} - $${x.val.toFixed(2)}</div>`;
});
document.getElementById("inventory").innerHTML=
`<div class="big">$${total.toFixed(2)}</div>`+html;
}

function clearInv(){
localStorage.removeItem("inv");
render();
}

render();

</script>

</body>
</html>
